<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Portal</title>
<style>
  html, body { margin: 0; background: #07040f; color: #d9c8ff; font-family: system-ui, Segoe UI, sans-serif; }
  #wrap { max-width: 1000px; margin: 0 auto; padding: 10px; text-align: center; }
  h1 { margin: 4px 0; font-size: 22px; color: #ff5cf0; text-shadow: 0 0 10px #ff5cf0; letter-spacing: 3px; }
  canvas { width: 100%; height: auto; background: #0b0618; border: 2px solid #5b2a9a; border-radius: 8px; box-shadow: 0 0 24px #5b2a9a88; touch-action: none; }
  #controls { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 10px; flex-wrap: wrap; }
  #pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; }
  #pad button, #restore { background: #1a0d33; color: #e9d8ff; border: 2px solid #8a4dff; border-radius: 8px; font-size: 22px; cursor: pointer; user-select: none; touch-action: none; }
  #pad button.on, #pad button:active { background: #8a4dff; color: #fff; box-shadow: 0 0 12px #8a4dff; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #restore { padding: 12px 20px; font-size: 16px; }
  #restore:hover { background: #8a4dff; }
  #help { font-size: 14px; line-height: 1.6; text-align: left; }
  kbd { background: #1a0d33; border: 1px solid #8a4dff; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>DARK PORTAL</h1>
  <canvas id="game" width="1000" height="680"></canvas>
  <div id="controls">
    <div id="pad">
      <button id="up" aria-label="Up">&#9650;</button>
      <button id="left" aria-label="Left">&#9664;</button>
      <button id="down" aria-label="Down">&#9660;</button>
      <button id="right" aria-label="Right">&#9654;</button>
    </div>
    <div id="help">
      <div><kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd> Drive. Release to stop.</div>
      <div><kbd>E</kbd> Board your passenger (stop inside the cab stop ring).</div>
      <div><kbd>R</kbd> Restore the cab, batteries and portal.</div>
      <div>Collect all three batteries, pick up the passenger, then deliver them to the portal.</div>
    </div>
    <button id="restore">Restore (R)</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Town layout: 4x3 blocks separated by 80px streets, all streets connected.
  const STREET = 80, COLS = 4, ROWS = 3;
  const BW = (W - STREET * (COLS + 1)) / COLS;   // 150
  const BH = (H - STREET * (ROWS + 1)) / ROWS;   // 120
  const blocks = [];
  const neon = ['#ff5cf0', '#38f2ff', '#ffe14d', '#7dff6b', '#ff7a5c'];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      blocks.push({
        x: STREET + c * (BW + STREET),
        y: STREET + r * (BH + STREET),
        w: BW, h: BH,
        color: neon[(r * COLS + c * 2 + r) % neon.length]
      });
    }
  }
  // Street centre helpers
  const sx = i => STREET / 2 + i * (BW + STREET);   // vertical street i centre x
  const sy = j => STREET / 2 + j * (BH + STREET);   // horizontal street j centre y

  const START = { x: sx(0), y: sy(3) };
  const BATTERY_POS = [
    { x: sx(4), y: sy(3) },                        // bottom-right corner
    { x: sx(0), y: sy(0) },                        // top-left corner
    { x: sx(2), y: sy(1) }                         // centre intersection
  ];
  const PORTAL = { x: sx(4), y: sy(0), r: 34 };    // top-right corner

  // Pickup zone: on the street intersection of vertical street 3 and horizontal street 2.
  const CAB_STOP = { x: sx(3), y: sy(2), r: 40 };

  const SPEED = 210;
  const HALF = 13;

  let cab, batteries, hint, hintTimer, time = 0;
  let missionState;   // 'collecting' | 'waiting' | 'aboard' | 'won'
  let passenger;      // { at: 'stop' | 'seat' | null }
  let trail = [], skid = 0;
  const TRAIL_LIFE = 1;      // seconds before a tyre mark disappears
  const SKID_TIME = 0.35;    // seconds of marks after each change of direction

  function reset() {
    trail = []; skid = 0;
    cab = { x: START.x, y: START.y, angle: -Math.PI / 2 };
    batteries = BATTERY_POS.map(p => ({ x: p.x, y: p.y, taken: false }));
    missionState = 'collecting';
    passenger = { at: null };
    hint = '';
    hintTimer = 0;
  }
  reset();

  const count = () => batteries.filter(b => b.taken).length;
  const powered = () => count() === 3;
  const isWon = () => missionState === 'won';

  // Pure board transition: only waiting + stopped + in zone moves the passenger into the seat.
  function tryBoard(state, input) {
    if (state.missionState === 'waiting' && state.passengerAt === 'stop' &&
        !input.anyArrowHeld && input.inZone) {
      return { missionState: 'aboard', passengerAt: 'seat' };
    }
    return state;
  }
  const isStopped = () => !(keys.up || keys.down || keys.left || keys.right);
  const inPickupZone = () => Math.hypot(cab.x - CAB_STOP.x, cab.y - CAB_STOP.y) < CAB_STOP.r;

  function handleBoardKey() {
    if (isWon()) return;
    const before = { missionState, passengerAt: passenger.at };
    const after = tryBoard(before, { anyArrowHeld: !isStopped(), inZone: inPickupZone() });
    if (after !== before) {
      missionState = after.missionState;
      passenger.at = after.passengerAt;
      hint = 'Passenger aboard. Drive to the portal.'; hintTimer = 4;
    }
  }

  function onThirdBattery() {
    missionState = 'waiting';
    passenger = { at: 'stop' };
    hint = 'The portal is powered! Drive to the cab stop and press E.'; hintTimer = 4;
  }

  // Single entry point for the win transition.
  function enterWon() { missionState = 'won'; }

  // Input
  const keys = { up: false, down: false, left: false, right: false };
  const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  window.addEventListener('keydown', e => {
    if (e.key in keyMap) { keys[keyMap[e.key]] = true; e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'e' || e.key === 'E') handleBoardKey();
  });
  window.addEventListener('keyup', e => {
    if (e.key in keyMap) { keys[keyMap[e.key]] = false; e.preventDefault(); }
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // On-screen buttons (mouse and touch)
  ['up', 'down', 'left', 'right'].forEach(dir => {
    const btn = document.getElementById(dir);
    const press = e => { keys[dir] = true; btn.classList.add('on'); e.preventDefault(); };
    const release = () => { keys[dir] = false; btn.classList.remove('on'); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });
  document.getElementById('restore').addEventListener('click', reset);

  function hits(x, y) {
    if (x - HALF < 0 || y - HALF < 0 || x + HALF > W || y + HALF > H) return true;
    for (const b of blocks) {
      if (x + HALF > b.x && x - HALF < b.x + b.w && y + HALF > b.y && y - HALF < b.y + b.h) return true;
    }
    return false;
  }

  function update(dt) {
    time += dt;
    if (hintTimer > 0) hintTimer -= dt;
    for (const m of trail) m.age += dt;
    trail = trail.filter(m => m.age < TRAIL_LIFE);
    if (skid > 0) skid -= dt;
    if (isWon()) return;

    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      const newAngle = Math.atan2(dy, dx);
      if (Math.abs(Math.atan2(Math.sin(newAngle - cab.angle), Math.cos(newAngle - cab.angle))) > 0.01) skid = SKID_TIME;
      cab.angle = newAngle;
      const nx = cab.x + dx * SPEED * dt;
      if (!hits(nx, cab.y)) cab.x = nx;
      const ny = cab.y + dy * SPEED * dt;
      if (!hits(cab.x, ny)) cab.y = ny;
      if (skid > 0) {
        const c = Math.cos(cab.angle), s = Math.sin(cab.angle);
        for (const side of [-8, 8]) {
          // rear wheel positions in the cab's local frame
          trail.push({ x: cab.x - 12 * c - side * s, y: cab.y - 12 * s + side * c, angle: cab.angle, age: 0 });
        }
      }
    }

    for (const b of batteries) {
      if (!b.taken && Math.hypot(cab.x - b.x, cab.y - b.y) < 28) {
        b.taken = true;
        if (powered()) onThirdBattery();
        else { hint = `Battery ${count()} of 3 collected.`; hintTimer = 2; }
      }
    }

    if (Math.hypot(cab.x - PORTAL.x, cab.y - PORTAL.y) < PORTAL.r) {
      if (powered()) {
        if (passenger.at === 'seat') enterWon();
        else { hint = 'Pick up your passenger'; hintTimer = 2; }
      } else { hint = 'The portal is dark. Find all three batteries.'; hintTimer = 2; }
    }
  }

  function glowRect(x, y, w, h, color) {
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.shadowBlur = 0;
  }

  function drawTown() {
    ctx.fillStyle = '#0b0618';
    ctx.fillRect(0, 0, W, H);
    // road dashes
    ctx.strokeStyle = '#2a1850'; ctx.lineWidth = 2; ctx.setLineDash([14, 14]);
    for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(sx(i), 0); ctx.lineTo(sx(i), H); ctx.stroke(); }
    for (let j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, sy(j)); ctx.lineTo(W, sy(j)); ctx.stroke(); }
    ctx.setLineDash([]);
    // buildings
    for (const b of blocks) {
      ctx.fillStyle = '#150c2b';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      glowRect(b.x, b.y, b.w, b.h, b.color);
      ctx.fillStyle = b.color + '88';
      for (let wx = b.x + 14; wx < b.x + b.w - 14; wx += 26) {
        for (let wy = b.y + 14; wy < b.y + b.h - 14; wy += 24) {
          if (((wx * 7 + wy * 13) | 0) % 5 !== 0) ctx.fillRect(wx, wy, 10, 10);
        }
      }
    }
  }

  function drawPortal() {
    const { x, y, r } = PORTAL;
    const on = powered();
    const pulse = on ? 1 + Math.sin(time * 5) * 0.08 : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = on ? '#38f2ff' : '#3a2a5a';
    ctx.shadowBlur = on ? 30 : 6;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, (r - i * 9) * pulse, (r - i * 9) * pulse, 0, 0, Math.PI * 2);
      ctx.strokeStyle = on ? ['#38f2ff', '#ff5cf0', '#ffffff'][i] : '#2b1d47';
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.fillStyle = on ? '#38f2ff55' : '#00000099';
    ctx.beginPath(); ctx.arc(0, 0, r - 24, 0, Math.PI * 2); ctx.fill();
    // three portal lamps, one per battery collected
    for (let i = 0; i < 3; i++) {
      const lit = i < count();
      ctx.beginPath();
      ctx.arc(-(r + 14) - i * 22, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = lit ? '#ffe14d' : '#2a1850';
      ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = lit ? 16 : 0;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#8a4dff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawGhost(x, y, scale) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.shadowColor = '#7dff6b'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#e8ffe4';
    ctx.beginPath();
    ctx.arc(0, -4, 8, Math.PI, 0);
    ctx.lineTo(8, 9); ctx.lineTo(4, 5); ctx.lineTo(0, 9); ctx.lineTo(-4, 5); ctx.lineTo(-8, 9);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#150c2b';
    ctx.fillRect(-4, -5, 2.5, 3); ctx.fillRect(1.5, -5, 2.5, 3);
    ctx.restore();
  }

  function drawCabStop() {
    if (missionState === 'collecting') return;
    ctx.save();
    ctx.shadowColor = '#7dff6b'; ctx.shadowBlur = 14;
    ctx.strokeStyle = '#7dff6b'; ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(CAB_STOP.x, CAB_STOP.y, CAB_STOP.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    if (passenger.at === 'stop') {
      drawGhost(CAB_STOP.x, CAB_STOP.y + Math.sin(time * 3) * 3, 1.6);
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#7dff6b';
      ctx.fillText('CAB STOP', CAB_STOP.x, CAB_STOP.y - CAB_STOP.r - 10);
    }
  }

  function drawBatteries() {
    for (const b of batteries) {
      if (b.taken) continue;
      const bob = Math.sin(time * 4 + b.x) * 3;
      ctx.save();
      ctx.translate(b.x, b.y + bob);
      ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffe14d';
      ctx.fillRect(-9, -13, 18, 26);
      ctx.fillRect(-4, -17, 8, 4);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#6b4d00';
      ctx.fillRect(-2, -8, 4, 16);
      ctx.restore();
    }
  }

  function drawTrail() {
    ctx.save();
    ctx.shadowColor = '#c8a8ff'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#c8a8ff';
    for (const m of trail) {
      ctx.globalAlpha = 0.8 * (1 - m.age / TRAIL_LIFE);
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.angle);
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCab() {
    ctx.save();
    ctx.translate(cab.x, cab.y);
    ctx.rotate(cab.angle);
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = '#b05cff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#9b3dff';
    ctx.fillRect(-18, -10, 36, 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d9b8ff';
    ctx.fillRect(-4, -8, 12, 16);          // windshield/roof
    ctx.fillStyle = '#ffe14d';
    ctx.fillRect(15, -8, 3, 5); ctx.fillRect(15, 3, 3, 5);   // headlights
    ctx.fillStyle = '#fff';
    ctx.fillRect(-12, -3, 6, 6);            // taxi sign
    if (passenger.at === 'seat') {
      ctx.save(); ctx.rotate(-cab.angle); drawGhost(0, 0, 0.9); ctx.restore();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#d9c8ff';
    ctx.textAlign = 'left';
    ctx.fillText('LAMPS', 14, 22);
    for (let i = 0; i < 3; i++) {
      const lit = i < count();
      ctx.beginPath();
      ctx.arc(94 + i * 28, 22, 9, 0, Math.PI * 2);
      ctx.fillStyle = lit ? '#ffe14d' : '#2a1850';
      ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = lit ? 16 : 0;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#8a4dff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.fillStyle = '#d9c8ff';
    ctx.textAlign = 'right';
    ctx.fillText(powered() ? 'Portal: POWERED' : 'Portal: dark', W - 14, 22);
    if (hintTimer > 0 && !isWon()) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(hint, W / 2, 22);
    }
  }

  function drawWin() {
    ctx.fillStyle = '#07040fcc';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.shadowColor = '#38f2ff'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#38f2ff';
    ctx.font = 'bold 56px system-ui, sans-serif';
    ctx.fillText('YOU WIN', W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d9c8ff';
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText('The ghost cab drove through the portal.', W / 2, H / 2 + 24);
    ctx.fillText('Press R or Restore to play again.', W / 2, H / 2 + 54);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    drawTown();
    drawPortal();
    drawCabStop();
    drawBatteries();
    drawTrail();
    drawCab();
    drawHUD();
    if (isWon()) drawWin();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
